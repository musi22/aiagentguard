name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/shared-types ./packages/policy-engine ./packages/risk-engine ".[dev]" pip-audit bandit
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --config-file pyproject.toml apps packages cli
      - name: Unit, integration, and security tests
        run: pytest tests/unit tests/integration tests/security --junitxml=pytest-results.xml
      - name: Dependency audit
        run: pip-audit
      - name: Static security scan
        run: bandit -q -r apps packages cli

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, gateway, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: agentguard-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate environment roots without remote state
        run: |
          for environment in dev staging prod; do
            terraform -chdir="infra/terraform/environments/$environment" init -backend=false
            terraform -chdir="infra/terraform/environments/$environment" validate
          done
          terraform -chdir=infra/terraform/bootstrap init -backend=false
          terraform -chdir=infra/terraform/bootstrap validate

