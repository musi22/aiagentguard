[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["agentguard>=0.1.0", "httpx>=0.27,<1"]

[project.scripts]
agentguard = "agentguard_cli:main"

[tool.setuptools]
py-modules = ["agentguard_cli"]
