[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-server"
version = "0.1.0"
description = "Tenant-scoped AI tool runtime authorization infrastructure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26", "cryptography>=44,<48", "httpx>=0.28,<1",
  "PyYAML>=6,<7", "jsonschema>=4.23,<5", "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3", "azure-identity>=1.19,<2",
  "azure-keyvault-secrets>=4.9,<5", "azure-storage-blob>=12.24,<13",
  "azure-monitor-opentelemetry>=1.6,<2", "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "redis>=6.4,<7", "redis-entraid>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "types-jsonschema>=4"]

[tool.setuptools]
packages = ["agentguard_api", "agentguard_gateway", "agentguard_worker"]
package-dir = {agentguard_api = "apps/api/agentguard_api", agentguard_gateway = "apps/gateway/agentguard_gateway", agentguard_worker = "apps/worker/agentguard_worker"}

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/security"]
pythonpath = ["apps/api", "apps/gateway", "apps/worker", "packages/policy-engine", "packages/risk-engine", "packages/shared-types", "packages/sdk-python", "cli"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["B008", "S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_strict_optional = true
follow_imports = "silent"
disable_error_code = ["arg-type", "attr-defined", "union-attr", "return-value"]
exclude = [
  "\\.venv",
  "node_modules",
  "build",
  "dist",
  "\\.egg-info",
]
